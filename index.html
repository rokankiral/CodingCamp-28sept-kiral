<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== TOTAL BALANCE (sticky header) ===== -->
  <header id="balance-header">
    <p class="balance-label">Total Pengeluaran</p>
    <h1 id="total-balance">Rp 0,00</h1>
  </header>

  <main id="app-container">

    <!-- ===== STORAGE WARNING BANNER (hidden by default) ===== -->
    <div id="storage-warning-banner" class="alert alert--warning" hidden>
      ⚠ Fitur penyimpanan data tidak tersedia. Transaksi tidak akan tersimpan setelah halaman ditutup.
    </div>

    <!-- ===== SPENDING LIMIT BAR ===== -->
    <div id="spending-limit-bar" class="panel">
      <label for="spending-limit">Batas per transaksi (Rp):</label>
      <input
        type="number"
        id="spending-limit"
        min="0"
        step="0.01"
        placeholder="0 = nonaktif"
        aria-label="Masukkan batas pengeluaran per transaksi"
      />
      <button id="btn-set-limit" class="btn btn--secondary">Set</button>
      <span id="limit-active-indicator" class="limit-indicator" aria-live="polite"></span>
    </div>

    <!-- ===== INPUT FORM ===== -->
    <section id="input-form-section" class="panel">
      <h2 class="panel__title">Tambah Transaksi</h2>
      <form id="input-form" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label for="item-name">Nama Item</label>
            <input
              type="text"
              id="item-name"
              maxlength="100"
              placeholder="Contoh: Makan siang"
              autocomplete="off"
              aria-required="true"
            />
          </div>

          <div class="form-group">
            <label for="item-amount">Jumlah (Rp)</label>
            <input
              type="number"
              id="item-amount"
              min="0.01"
              max="999999999.99"
              step="0.01"
              placeholder="0.00"
              aria-required="true"
            />
          </div>

          <div class="form-group">
            <label for="item-category">Kategori</label>
            <select id="item-category" aria-required="true">
              <option value="">-- Pilih Kategori --</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Fun">Fun</option>
            </select>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" id="btn-submit" class="btn btn--primary">Tambah</button>
        </div>

        <div id="form-errors" class="form-errors" aria-live="polite" role="alert"></div>
      </form>
    </section>

    <!-- ===== SORT BAR ===== -->
    <div id="sort-bar" class="panel panel--compact">
      <label for="sort-select">Urutkan:</label>
      <select id="sort-select">
        <option value="default">Default (urutan masuk)</option>
        <option value="amount-desc">Jumlah: Terbesar dulu</option>
        <option value="amount-asc">Jumlah: Terkecil dulu</option>
        <option value="category-asc">Kategori: A–Z</option>
      </select>
    </div>

    <!-- ===== TRANSACTION LIST ===== -->
    <section id="transaction-list-section" class="panel">
      <h2 class="panel__title">Daftar Transaksi</h2>
      <div id="transaction-list-container">
        <ul id="transaction-list" role="list" aria-label="Daftar transaksi">
          <!-- Items injected by renderList() -->
        </ul>
        <p id="empty-message" class="empty-message">
          Belum ada transaksi yang dicatat.
        </p>
      </div>
    </section>

    <!-- ===== MONTHLY SUMMARY (hidden by default) ===== -->
    <div class="panel panel--compact">
      <button id="btn-toggle-summary" class="btn btn--ghost">
        Tampilkan Ringkasan Bulanan
      </button>
    </div>

    <section id="monthly-summary" hidden class="panel">
      <h2 class="panel__title">Ringkasan Bulanan</h2>
      <div id="monthly-summary-content">
        <!-- Injected by renderMonthlySummary() -->
      </div>
    </section>

    <!-- ===== CHART ===== -->
    <section id="chart-container" class="panel">
      <h2 class="panel__title">Distribusi Pengeluaran</h2>
      <div class="chart-wrapper">
        <canvas id="expense-chart" width="300" height="300" aria-label="Pie chart distribusi pengeluaran" role="img"></canvas>
        <p id="chart-empty-message" class="empty-message">
          Belum ada data pengeluaran.
        </p>
      </div>
      <div id="chart-legend" class="chart-legend" aria-label="Legenda chart"></div>
    </section>

  </main>

  <!-- Toast container -->
  <div id="toast-container" class="toast-container" aria-live="assertive" aria-atomic="true"></div>

  <!-- Chart.js via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- App logic -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
